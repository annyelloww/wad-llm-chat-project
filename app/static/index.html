<!doctype html><html lang="en"><head><meta charset="utf-8"><title>WAD LLM Chat</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font-family:system-ui;margin:0;background:#f4f4f5}.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}aside{background:#111827;color:white;padding:20px}main{padding:24px;display:grid;grid-template-rows:auto 1fr auto;gap:16px}input,button,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid #d4d4d8}button{cursor:pointer;border:0;background:#2563eb;color:white;font-weight:700}.secondary{background:#374151}.card{background:white;border-radius:20px;padding:16px;box-shadow:0 10px 25px #0001}.chat-item{padding:10px;border-radius:12px;background:#ffffff1a;cursor:pointer;margin:8px 0}.messages{overflow:auto;display:grid;gap:12px}.msg{max-width:800px;padding:14px 16px;border-radius:18px;white-space:pre-wrap}.user{justify-self:end;background:#dbeafe}.assistant{justify-self:start;background:white}.hidden{display:none}.muted{color:#a1a1aa}</style></head><body><div class="app"><aside><h2>llm chat</h2><p class="muted">async fastapi + jwt + redis + postgres</p><div id="authBox"><input id="loginInput" placeholder="login"><br><br><input id="passwordInput" placeholder="password" type="password"><br><br><button onclick="register()">register</button><br><br><button class="secondary" onclick="login()">login</button><p><a style="color:#93c5fd" href="/api/auth/github/login">github oauth</a></p></div><div id="chatBox" class="hidden"><button onclick="newChat()">+ new chat</button><div id="chatList"></div><br><button class="secondary" onclick="logout()">logout</button></div></aside><main><div class="card"><h1 id="title">choose or create chat</h1><p class="muted">history is stored in database</p></div><section id="messages" class="messages"></section><div class="card"><textarea id="promptInput" rows="3" placeholder="write message..."></textarea><br><br><button onclick="sendMessage()">send</button></div></main></div><script>let accessToken=localStorage.getItem('accessToken');let refreshToken=localStorage.getItem('refreshToken');let currentChatId=null;function authHeaders(){return {'Authorization':`Bearer ${accessToken}`,'Content-Type':'application/json'}}async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{...(opt.headers||{}),...authHeaders()}});if(r.status===401&&refreshToken){let rr=await fetch(`/api/auth/refresh?refresh_token=${refreshToken}`,{method:'POST'});if(rr.ok){let t=await rr.json();saveTokens(t);return api(path,opt)}}if(!r.ok)throw new Error(await r.text());return r.json()}function saveTokens(d){accessToken=d.access_token;refreshToken=d.refresh_token;localStorage.setItem('accessToken',accessToken);localStorage.setItem('refreshToken',refreshToken);authBox.classList.add('hidden');chatBox.classList.remove('hidden')}async function register(){let r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:loginInput.value,password:passwordInput.value})});let d=await r.json();if(!r.ok){alert(JSON.stringify(d));return}saveTokens(d);loadChats()}async function login(){let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:loginInput.value,password:passwordInput.value})});let d=await r.json();if(!r.ok){alert(JSON.stringify(d));return}saveTokens(d);loadChats()}async function loadChats(){if(!accessToken)return;authBox.classList.add('hidden');chatBox.classList.remove('hidden');let chats=await api('/api/chats');chatList.innerHTML='';chats.forEach(c=>{let div=document.createElement('div');div.className='chat-item';div.textContent=c.title;div.onclick=()=>openChat(c.id);chatList.appendChild(div)})}async function newChat(){let chat=await api('/api/chats',{method:'POST',body:JSON.stringify({title:'new chat'})});await loadChats();openChat(chat.id)}async function openChat(id){currentChatId=id;let chat=await api(`/api/chats/${id}`);title.textContent=chat.title;messages.innerHTML='';chat.messages.forEach(addMessage)}function addMessage(m){let div=document.createElement('div');div.className=`msg ${m.role}`;div.textContent=m.content;messages.appendChild(div);messages.scrollTop=messages.scrollHeight;return div}async function sendMessage(){if(!currentChatId)await newChat();let text=promptInput.value.trim();if(!text)return;promptInput.value='';addMessage({role:'user',content:text});let ad=addMessage({role:'assistant',content:''});let r=await fetch(`/api/chats/${currentChatId}/messages/stream`,{method:'POST',headers:authHeaders(),body:JSON.stringify({content:text})});let reader=r.body.getReader();let dec=new TextDecoder();while(true){let {value,done}=await reader.read();if(done)break;ad.textContent+=dec.decode(value)}}async function logout(){if(refreshToken)await fetch(`/api/auth/logout?refresh_token=${refreshToken}`,{method:'POST'});localStorage.clear();location.reload()}loadChats().catch(()=>{})</script></body></html>
